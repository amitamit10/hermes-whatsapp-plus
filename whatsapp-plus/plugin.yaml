name: whatsapp-plus
version: 2.0.0
description: >
  WhatsApp Plus - extends the stock WhatsApp platform by subclassing the adapter (group history + context, owner-only triggering
  in groups, mute/bot list, temporary contacts, reactions, runtime settings) with a forked Node bridge selected via
  platforms.whatsapp.extra.bridge_script, plus the whatsapp_* tools. Lives outside the Hermes source tree.
author: amitamit10
requires_plugins:
  - whatsapp-platform
provides_tools:
  - whatsapp_send
  - whatsapp_contacts
  - whatsapp_history
  - whatsapp_group_control
  - whatsapp_status
  - whatsapp_delete
  - whatsapp_backfill
  - whatsapp_settings
  - whatsapp_react
  - whatsapp_groups
  - whatsapp_poll
  - whatsapp_pairing
  - whatsapp_campaign
  - whatsapp_call_me
