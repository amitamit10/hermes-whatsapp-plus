<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="How fast the voice answers" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect x="0.5" y="0.5" width="759" height="259" rx="8" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="34" font-size="16" font-weight="600" fill="#1f2328">How fast the voice answers</text><text x="24" y="54" font-size="12" fill="#656d76">Time from the end of his sentence until the voice starts speaking (milliseconds)</text><text x="24" y="98" font-size="13" fill="#1f2328">call-back, 46 s</text><rect x="170" y="80" width="165.6" height="18" rx="3" fill="#0969da"/><text x="343.6" y="93" font-size="12" fill="#1f2328">average 346 ms (n=2)</text><rect x="170" y="104" width="326.4" height="18" rx="3" fill="#bf8700"/><text x="504.4" y="117" font-size="12" fill="#1f2328">slowest 682 ms</text><text x="24" y="168" font-size="13" fill="#1f2328">answered, 98 s</text><rect x="170" y="150" width="460.9" height="18" rx="3" fill="#0969da"/><text x="638.9" y="163" font-size="12" fill="#1f2328">average 963 ms (n=1)</text><rect x="170" y="174" width="460.9" height="18" rx="3" fill="#bf8700"/><text x="638.9" y="187" font-size="12" fill="#1f2328">slowest 963 ms</text><text x="24" y="242" font-size="11" fill="#656d76">Two real calls, very few spoken answers each: treat as a sanity check, not a benchmark.</text></svg>