<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 358" width="760" height="358" role="img" aria-label="Parallel lookups on a call" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect x="0.5" y="0.5" width="759" height="357" rx="8" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="34" font-size="16" font-weight="600" fill="#1f2328">Parallel lookups on a call</text><text x="24" y="54" font-size="12" fill="#656d76">answered call, 3 lookups asked in one sentence (seconds after the questions were asked)</text><line x1="170.0" y1="70" x2="170.0" y2="238" stroke="#d0d7de"/><text x="170.0" y="254" font-size="11" text-anchor="middle" fill="#656d76">0s</text><line x1="321.8" y1="70" x2="321.8" y2="238" stroke="#d0d7de"/><text x="321.8" y="254" font-size="11" text-anchor="middle" fill="#656d76">10s</text><line x1="473.7" y1="70" x2="473.7" y2="238" stroke="#d0d7de"/><text x="473.7" y="254" font-size="11" text-anchor="middle" fill="#656d76">20s</text><line x1="625.5" y1="70" x2="625.5" y2="238" stroke="#d0d7de"/><text x="625.5" y="254" font-size="11" text-anchor="middle" fill="#656d76">30s</text><text x="24" y="101" font-size="13" fill="#1f2328">weather</text><rect x="170.0" y="84" width="275.0" height="24" rx="4" fill="#0969da"/><text x="437.0" y="100" font-size="12" fill="#fff" text-anchor="end">18.1 s</text><text x="24" y="157" font-size="13" fill="#1f2328">opening hours</text><rect x="170.0" y="140" width="361.6" height="24" rx="4" fill="#0969da"/><text x="523.6" y="156" font-size="12" fill="#fff" text-anchor="end">23.8 s</text><text x="24" y="213" font-size="13" fill="#1f2328">shop checkout</text><rect x="170.0" y="196" width="523.8" height="24" rx="4" fill="#0969da"/><text x="685.8" y="212" font-size="12" fill="#fff" text-anchor="end">34.5 s</text><text x="24" y="282" font-size="13" fill="#1f2328">All three ran at the same time: <tspan font-weight="600" fill="#1a7f37">34 s</tspan> instead of about <tspan font-weight="600" fill="#bf8700">76 s</tspan> one after the other.</text><text x="24" y="304" font-size="11" fill="#656d76">One real call, n = 3 lookups. Each lookup is a full Hermes turn with tools, so the time is Hermes working, not the voice.</text></svg>